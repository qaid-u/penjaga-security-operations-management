map "$status:$uri" $penjaga_cache_control {
    default "no-cache";
    ~^\d+:/api/ "private, no-store";
    ~^\d+:/uploads/ "private, no-store";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    ~^(200|206|304):/models/ "public, max-age=3600, must-revalidate";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header Cache-Control $penjaga_cache_control always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    location ^~ /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
    }
    location ^~ /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Cache-Control;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ^~ /models/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
