services:
  database:
    image: postgres:16-alpine
    container_name: penjaga_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-penjaga_db}
      POSTGRES_USER: ${POSTGRES_USER:-penjaga_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ./backend/database/migrations/003_lokasi_3d.sql:/docker-entrypoint-initdb.d/03-lokasi-3d.sql:ro
      - ./backend/database/migrations/004_nlp_review.sql:/docker-entrypoint-initdb.d/04-nlp-review.sql:ro
      - ./backend/database/migrations/005_djm_security_posts.sql:/docker-entrypoint-initdb.d/05-djm-security-posts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-penjaga_admin} -d ${POSTGRES_DB:-penjaga_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: penjaga_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters}
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-penjaga_db}
      PGUSER: ${POSTGRES_USER:-penjaga_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the deployed frontend origin}
      TRUST_PROXY: '1'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_REVIEW_MODEL: ${GEMINI_REVIEW_MODEL:-gemini-3.5-flash-lite}
      NLP_AI_REVIEW_ENABLED: ${NLP_AI_REVIEW_ENABLED:-false}
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: penjaga_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
